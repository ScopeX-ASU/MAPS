criterion:
  name: distanceLoss
  max_distance: 0.15

aux_criterion:
  curl_loss:
    weight: 0.0
  tv_loss:
    weight: 0.0
    norm: False

optimizer:
  name: adam
  lr: 0.01
  weight_decay: 0.0

lr_scheduler:
  name: cosine
  lr_gamma: 0.99
  lr_min: 0

run:
  experiment: "bending_local_search"
  n_epochs: 100
  use_cuda: 1
  gpu_id: 0
  deterministic: 1
  random_state: 42
  log_interval: 10

quantize:
  weight_bit: 32
  input_bit: 32

checkpoint:
  save_model: False
  save_best_model_k: 3
  checkpoint_dir: "bending/local_search/train_local_search"
  model_comment: ""
  resume: 0
  restore_checkpoint: ""
  no_linear: 0
  dump_gds: True

model:
  name: "BendingOptimization"
  device_type: "Bending"
  device_cfg:
    box_size: [2, 2]
    port_len: [1.8, 1.8]
    port_width: [0.48, 0.48]
  hr_resolution: 310
  obj_cfg: {}
  sim_cfg:
    solver: "ceviche_torch"
    binary_projection:
        fw_threshold: 100
        bw_threshold: 100
        mode: "regular"
    border_width: [0, 1.8, 1.8, 0]
    PML: [0.5, 0.5]
    cell_size: None
    resolution: 50
    wl_cen: 1.55
    wl_width: 0
    n_wl: 1
    neural_solver: null
    numerical_solver: solve_direct
    use_autodiff: False
  design_region_param_cfgs:
    design_region_1:
      method: levelset
      rho_resolution: [25, 25]
      transform:
          - type: blur
            mfs: 0.05
            resolutions: [310, 310]
            dim: xy
          - type: binarize
      init_method: random
      denorm_mode: linear_eps
      interpolation: bilinear
      binary_projection:
        fw_threshold: 100
        bw_threshold: 100
        mode: regular

debug:
  verbose: 1

plot:
  plot: True
  interval: 5
  root: plot
  dir_name: bending
  plot_name: bending_plot
  objs: ["fwd_trans"]
  field_keys: [
      ["in_slice_1", 1.55, "Ez1", 300],
  ]
  in_slice_names: ["in_slice_1"]
  exclude_slice_names: []
