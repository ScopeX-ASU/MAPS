[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MAPS"
version = "0.0.5"
description = "MAPS: Multi-Fidelity AI-Augmented Photonic Simulation and Inverse Design Infrastructure"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
notebook-visualization = [
  "ipympl>=0.9",
  "ipywidgets>=8",
]

[tool.setuptools]
include-package-data = true
py-modules = [
  "train",
  "train_NN",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "data*", "thirdparty*", "gpu_subpixel*"]
namespaces = true
