[pytest]
testpaths = tests
addopts = -ra
markers =
    unit: fast deterministic tests of local behavior and public contracts.
    integration: multi-component workflow and serialization tests.
    gradient: autograd or adjoint correctness and gradient-layout tests.
    numerical: solver, material, FoM, and scientific regression tests.
    gpu: tests requiring CUDA or another accelerator.
    fdtdx: tests requiring the pinned FDTDX simulation environment.
    slow: tests that are intentionally excluded from the fast PR suite.
